
spring.application.name=com.klu.recuirementss

# ===============================
# Database Connection
# ===============================

# Local STS uses localhost:3306 by default.
# Docker Compose overrides this URL.

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smarthire_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# Hibernate / JPA Settings
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Server Configuration
# ===============================

server.port=8080

# ===============================
# Swagger / OpenAPI
# ===============================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===============================
# JWT Authentication
# ===============================

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

# ===============================
# Spring Security Debug
# ===============================

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web.access=DEBUG
logging.level.org.springframework.security.authorization=DEBUG

# ===============================
# Tomcat Async Request Timeout
# ===============================

spring.mvc.async.request-timeout=210000

# ===============================
# Google Gemini AI Configuration
# ===============================

gemini.api.key=${GEMINI_API_KEY}
gemini.api.model=gemini-3.6-flash
